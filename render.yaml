services:
  - type: web
    name: truepage-scan
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SCAN_ACCESS_KEY
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false  # Set to your actual https://your-service.onrender.com URL
